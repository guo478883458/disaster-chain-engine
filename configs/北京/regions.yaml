# ============================================================================
# 北京地区子区域定义
# ============================================================================
# 北京 16 行政区，含所属水系和地理方位信息。
# == 行政区划信息 ==
# 中心城区：东城区、西城区、朝阳区、海淀区、丰台区、石景山区
# 近郊区：门头沟区、房山区、通州区、顺义区、昌平区、大兴区
# 远郊区：怀柔区、平谷区、密云区、延庆区
# == 水系信息 ==
# 永定河水系：门头沟（上游）→ 房山 → 大兴
# 潮白河水系：密云（上游）→ 顺义 → 通州
# 北运河水系：昌平（上游）→ 海淀 → 朝阳 → 通州
# == 地理方位 ==
# 西部山区：门头沟、延庆
# 北部山区：怀柔、密云
# 南部平原：大兴、房山、通州
# 东部平原：顺义、平谷
# ============================================================================

