# ============================================================================
# 灾害链贝叶斯网络 - 模型定义模板
# ============================================================================
# 本文件是通用模型模板，适用于任何地区。
# 各地区可复制此模板到 configs/<地区名>/ 目录下，按需调整权重。
#
# 调参指南：
#   - 输入节点（气象/水文/地形/地质/城市）：cpd.type = uniform（先验均匀）
#     各地区无需修改，差异由证据传入体现。
#   - 子节点（暴雨强度/城市排水能力/土壤-水文状态/地形因子/地质因子）：
#     cpd.type = weighted_sum，可调整 weights 中各父节点权重。
#     干旱地区可降低降水类权重，沿海地区可提高潮汐/风向权重。
#   - 内涝深度：cpd.type = multi_weighted，可调整各因子权重。
#     山区可提高地形因子权重，平原可提高排水因子权重。
#   - 地质易发性：cpd.type = weighted_sum，可调整权重。
#     地质活跃区可提高地质因子权重。
#   - 输出节点（内涝风险/地质灾害概率）：cpd.type = explicit，
#     一般无需修改，若有地区历史灾损数据可替换。
# ============================================================================

model:
  name: "暴雨→内涝→地质灾害 灾害链推理模型（通用模板）"
  description: "5类40输入，扩展至气象10/水文7/地形8/地质8/城市7"
  version: "2.0-region-template"

# ============================================================================
# 节点定义
# ============================================================================
nodes:
  # ═══════════════════════════════════════════════════════════════════════════
  # 气象输入 (10)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: 降水强度
    category: 气象
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 降水时长
    category: 气象
    states: [短, 长]
    cpd:
      type: uniform

  - name: 风力
    category: 气象
    states: [弱, 强]
    cpd:
      type: uniform

  - name: 风向
    category: 气象
    states: [离岸, 向岸]
    cpd:
      type: uniform

  - name: 湿度
    category: 气象
    states: [干燥, 湿润]
    cpd:
      type: uniform

  - name: 气压
    category: 气象
    states: [正常, 偏低]
    cpd:
      type: uniform

  - name: 气温
    category: 气象
    states: [低温, 适温, 高温]
    cpd:
      type: uniform

  - name: 露点温度
    category: 气象
    states: [低, 高]
    cpd:
      type: uniform

  - name: 对流有效位能CAPE
    category: 气象
    states: [低, 高]
    cpd:
      type: uniform

  - name: 垂直风切变
    category: 气象
    states: [小, 大]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════════════════
  # 水文输入 (7)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: 前期土壤含水量
    category: 水文
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 径流系数
    category: 水文
    states: [小, 大]
    cpd:
      type: uniform

  - name: 河道水位
    category: 水文
    states: [正常, 警戒, 危险]
    cpd:
      type: uniform

  - name: 地下水埋深
    category: 水文
    states: [深, 浅]
    cpd:
      type: uniform

  - name: 湖泊调蓄能力
    category: 水文
    states: [强, 弱]
    cpd:
      type: uniform

  - name: 潮汐影响
    category: 水文
    states: [无, 小, 大]
    cpd:
      type: uniform

  - name: 蒸发量
    category: 水文
    states: [小, 大]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════════════════
  # 地形输入 (8)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: 海拔
    category: 地形
    states: [低, 高]
    cpd:
      type: uniform

  - name: 坡度
    category: 地形
    states: [缓, 陡]
    cpd:
      type: uniform

  - name: 坡向
    category: 地形
    states: [阴坡, 阳坡]
    cpd:
      type: uniform

  - name: 地形起伏度
    category: 地形
    states: [小, 大]
    cpd:
      type: uniform

  - name: 汇流面积
    category: 地形
    states: [小, 大]
    cpd:
      type: uniform

  - name: 河网密度
    category: 地形
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 地表粗糙度
    category: 地形
    states: [小, 大]
    cpd:
      type: uniform

  - name: 沟谷密度
    category: 地形
    states: [低, 中, 高]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════════════════
  # 地质输入 (8)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: 植被覆盖
    category: 地质
    states: [好, 差]
    cpd:
      type: uniform

  - name: 土壤渗透性
    category: 地质
    states: [好, 差]
    cpd:
      type: uniform

  - name: 岩性
    category: 地质
    states: [坚硬, 软弱]
    cpd:
      type: uniform

  - name: 距断层距离
    category: 地质
    states: [远, 近]
    cpd:
      type: uniform

  - name: 地震烈度
    category: 地质
    states: [无, 弱, 强]
    cpd:
      type: uniform

  - name: 风化程度
    category: 地质
    states: [弱, 中, 强]
    cpd:
      type: uniform

  - name: 节理发育程度
    category: 地质
    states: [不发育, 发育, 很发育]
    cpd:
      type: uniform

  - name: 滑坡历史密度
    category: 地质
    states: [低, 中, 高]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════════════════
  # 城市输入 (7)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: 历史排水时间
    category: 城市
    states: [快, 慢]
    cpd:
      type: uniform

  - name: 管网排水能力
    category: 城市
    states: [强, 弱]
    cpd:
      type: uniform

  - name: 下垫面硬化率
    category: 城市
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 道路积水历史频率
    category: 城市
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 建筑密度
    category: 城市
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 绿地率
    category: 城市
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 应急排水能力
    category: 城市
    states: [强, 弱]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════════════════
  # 子节点层 (5) — 聚合输入，控制父节点数 ≤ 7
  # ═══════════════════════════════════════════════════════════════════════════

  # ── 子节点1：暴雨强度（7 气象父节点）──
  - name: 暴雨强度
    category: 子节点
    states: [弱, 强]
    cpd:
      type: weighted_sum
      parents: [降水强度, 降水时长, 风力, 风向, 湿度, 气压, 对流有效位能CAPE, 露点温度]
      target_state: 强
      max_prob: 0.95
      weights:
        降水强度:       {低: 0.0, 中: 0.25, 高: 0.50}
        降水时长:       {短: 0.0, 长: 0.10}
        风力:           {弱: 0.0, 强: 0.08}
        风向:           {离岸: 0.0, 向岸: 0.05}
        湿度:           {干燥: 0.0, 湿润: 0.05}
        气压:           {正常: 0.0, 偏低: 0.06}
        对流有效位能CAPE: {低: 0.0, 高: 0.08}
        露点温度:       {低: 0.0, 高: 0.03}

  # ── 子节点2：城市排水能力（7 城市父节点）──
  - name: 城市排水能力
    category: 子节点
    states: [强, 弱]
    cpd:
      type: weighted_sum
      parents: [历史排水时间, 管网排水能力, 下垫面硬化率, 道路积水历史频率, 建筑密度, 绿地率, 应急排水能力]
      target_state: 弱
      max_prob: 0.95
      weights:
        历史排水时间:     {快: 0.0, 慢: 0.20}
        管网排水能力:     {强: 0.0, 弱: 0.18}
        下垫面硬化率:     {低: 0.0, 中: 0.06, 高: 0.10}
        道路积水历史频率:  {低: 0.0, 中: 0.08, 高: 0.15}
        建筑密度:         {低: 0.0, 中: 0.04, 高: 0.07}
        绿地率:           {低: 0.10, 中: 0.05, 高: 0.0}
        应急排水能力:     {强: 0.0, 弱: 0.15}

  # ── 子节点3：土壤-水文状态（7 父节点：水文+气象）──
  - name: 土壤-水文状态
    category: 子节点
    states: [有利, 不利]
    cpd:
      type: weighted_sum
      parents: [前期土壤含水量, 径流系数, 河道水位, 地下水埋深, 潮汐影响, 气温, 湖泊调蓄能力]
      target_state: 不利
      max_prob: 0.95
      weights:
        前期土壤含水量: {低: 0.0, 中: 0.10, 高: 0.20}
        径流系数:       {小: 0.0, 大: 0.15}
        河道水位:       {正常: 0.0, 警戒: 0.10, 危险: 0.18}
        地下水埋深:     {深: 0.0, 浅: 0.12}
        潮汐影响:       {无: 0.0, 小: 0.06, 大: 0.10}
        气温:           {低温: 0.0, 适温: 0.04, 高温: 0.08}
        湖泊调蓄能力:   {强: 0.0, 弱: 0.10}

  # ── 子节点4：地形因子（7 地形父节点）──
  - name: 地形因子
    category: 子节点
    states: [有利, 不利]
    cpd:
      type: weighted_sum
      parents: [坡度, 坡向, 地形起伏度, 汇流面积, 河网密度, 地表粗糙度, 沟谷密度]
      target_state: 不利
      max_prob: 0.95
      weights:
        坡度:         {缓: 0.0, 陡: 0.30}
        坡向:         {阴坡: 0.0, 阳坡: 0.06}
        地形起伏度:   {小: 0.0, 大: 0.20}
        汇流面积:     {小: 0.0, 大: 0.08}
        河网密度:     {低: 0.0, 中: 0.06, 高: 0.10}
        地表粗糙度:   {小: 0.0, 大: 0.06}
        沟谷密度:     {低: 0.0, 中: 0.08, 高: 0.15}

  # ── 子节点5：地质因子（7 地质父节点）──
  - name: 地质因子
    category: 子节点
    states: [有利, 不利]
    cpd:
      type: weighted_sum
      parents: [植被覆盖, 土壤渗透性, 岩性, 距断层距离, 地震烈度, 风化程度, 节理发育程度]
      target_state: 不利
      max_prob: 0.95
      weights:
        植被覆盖:     {好: 0.0, 差: 0.12}
        土壤渗透性:   {好: 0.0, 差: 0.10}
        岩性:         {坚硬: 0.0, 软弱: 0.18}
        距断层距离:   {远: 0.0, 近: 0.12}
        地震烈度:     {无: 0.0, 弱: 0.08, 强: 0.15}
        风化程度:     {弱: 0.0, 中: 0.06, 强: 0.13}
        节理发育程度: {不发育: 0.0, 发育: 0.06, 很发育: 0.10}

  # ═══════════════════════════════════════════════════════════════════════════
  # 主链中间节点 (2)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── 内涝深度（6 父节点：子节点+地形+气象）──
  - name: 内涝深度
    category: 中间环节
    states: [无, 浅, 深]
    cpd:
      type: multi_weighted
      parents: [暴雨强度, 海拔, 城市排水能力, 土壤-水文状态, 垂直风切变, 蒸发量]
      states:
        - name: 深
          weights:
            暴雨强度:       {弱: 0.05, 强: 0.28}
            海拔:           {低: 0.15, 高: 0.0}
            城市排水能力:   {强: 0.0, 弱: 0.20}
            土壤-水文状态:  {有利: 0.0, 不利: 0.15}
            垂直风切变:     {小: 0.0, 大: 0.05}
            蒸发量:         {小: 0.05, 大: 0.0}
          max_prob: 0.95
        - name: 浅
          type: scaled_residual
          base: 0.55
          scale: 0.70
          residual_of: 深
        - name: 无
          type: residual

  # ── 地质易发性（3 父节点：2子节点+历史数据）──
  - name: 地质易发性
    category: 中间环节
    states: [低, 高]
    cpd:
      type: weighted_sum
      parents: [地形因子, 地质因子, 滑坡历史密度]
      target_state: 高
      max_prob: 0.95
      weights:
        地形因子:     {有利: 0.0, 不利: 0.35}
        地质因子:     {有利: 0.0, 不利: 0.40}
        滑坡历史密度: {低: 0.0, 中: 0.10, 高: 0.20}

  # ═══════════════════════════════════════════════════════════════════════════
  # 输出风险 (2)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: 内涝风险
    category: 输出
    states: [低, 中, 高]
    cpd:
      type: explicit
      parents: [内涝深度]
      values:
        - [0.90, 0.15, 0.02]
        - [0.08, 0.55, 0.13]
        - [0.02, 0.30, 0.85]

  - name: 地质灾害概率
    category: 输出
    states: [低, 高]
    cpd:
      type: explicit
      parents: [地质易发性, 内涝深度]
      values:
        - [0.98, 0.85, 0.60, 0.70, 0.30, 0.10]
        - [0.02, 0.15, 0.40, 0.30, 0.70, 0.90]

# ============================================================================
# 有向边
# ============================================================================
edges:
  # 气象 → 暴雨强度
  - [降水强度, 暴雨强度]
  - [降水时长, 暴雨强度]
  - [风力, 暴雨强度]
  - [风向, 暴雨强度]
  - [湿度, 暴雨强度]
  - [气压, 暴雨强度]
  - [对流有效位能CAPE, 暴雨强度]
  - [露点温度, 暴雨强度]

  # 城市 → 城市排水能力
  - [历史排水时间, 城市排水能力]
  - [管网排水能力, 城市排水能力]
  - [下垫面硬化率, 城市排水能力]
  - [道路积水历史频率, 城市排水能力]
  - [建筑密度, 城市排水能力]
  - [绿地率, 城市排水能力]
  - [应急排水能力, 城市排水能力]

  # 水文+气象 → 土壤-水文状态
  - [前期土壤含水量, 土壤-水文状态]
  - [径流系数, 土壤-水文状态]
  - [河道水位, 土壤-水文状态]
  - [地下水埋深, 土壤-水文状态]
  - [潮汐影响, 土壤-水文状态]
  - [气温, 土壤-水文状态]
  - [湖泊调蓄能力, 土壤-水文状态]

  # 地形 → 地形因子
  - [坡度, 地形因子]
  - [坡向, 地形因子]
  - [地形起伏度, 地形因子]
  - [汇流面积, 地形因子]
  - [河网密度, 地形因子]
  - [地表粗糙度, 地形因子]
  - [沟谷密度, 地形因子]

  # 地质 → 地质因子
  - [植被覆盖, 地质因子]
  - [土壤渗透性, 地质因子]
  - [岩性, 地质因子]
  - [距断层距离, 地质因子]
  - [地震烈度, 地质因子]
  - [风化程度, 地质因子]
  - [节理发育程度, 地质因子]

  # 子节点+直接因素 → 内涝深度
  - [暴雨强度, 内涝深度]
  - [海拔, 内涝深度]
  - [城市排水能力, 内涝深度]
  - [土壤-水文状态, 内涝深度]
  - [垂直风切变, 内涝深度]
  - [蒸发量, 内涝深度]

  # 子节点+历史数据 → 地质易发性
  - [地形因子, 地质易发性]
  - [地质因子, 地质易发性]
  - [滑坡历史密度, 地质易发性]

  # 中间 → 输出
  - [内涝深度, 内涝风险]
  - [地质易发性, 地质灾害概率]
  - [内涝深度, 地质灾害概率]

# ============================================================================
# 参数列表
# ============================================================================
input_params:
  - 降水强度
  - 降水时长
  - 风力
  - 风向
  - 湿度
  - 气压
  - 气温
  - 露点温度
  - 对流有效位能CAPE
  - 垂直风切变
  - 前期土壤含水量
  - 径流系数
  - 河道水位
  - 地下水埋深
  - 湖泊调蓄能力
  - 潮汐影响
  - 蒸发量
  - 海拔
  - 坡度
  - 坡向
  - 地形起伏度
  - 汇流面积
  - 河网密度
  - 地表粗糙度
  - 沟谷密度
  - 植被覆盖
  - 土壤渗透性
  - 岩性
  - 距断层距离
  - 地震烈度
  - 风化程度
  - 节理发育程度
  - 滑坡历史密度
  - 历史排水时间
  - 管网排水能力
  - 下垫面硬化率
  - 道路积水历史频率
  - 建筑密度
  - 绿地率
  - 应急排水能力

outputs:
  - 内涝风险
  - 地质灾害概率