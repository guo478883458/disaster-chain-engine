# ============================================================================
# 区域间耦合边定义模板
# ============================================================================
# 本文件定义区域之间的相互影响关系（耦合边）。
# 每条边包含：源区域、目标区域、通道类型、权重、节点映射。
#
# 通道类型说明：
#   - meteorological（气象通道）：雨带移动方向，西→东/南→北，权重 0.5~0.7
#   - hydrological（水文通道）：河流上游→下游，权重 0.3~0.5
#
# 节点映射：源区域的哪个节点影响目标区域的哪个节点
#   通常：源区域.暴雨强度 → 目标区域.暴雨强度（气象通道）
#         源区域.内涝深度 → 目标区域.土壤-水文状态（水文通道）
# ============================================================================

# 耦合边列表
coupling_edges:
  # 示例：气象通道（雨带移动）
  - source: 示例区A
    target: 示例区B
    channel: meteorological
    weight: 0.6
    description: "雨带西→东移动"
    # 节点映射：源区域暴雨强度 → 目标区域暴雨强度
    source_node: 暴雨强度
    target_node: 暴雨强度

  # 示例：水文通道（河流上游→下游）
  - source: 示例区A
    target: 示例区B
    channel: hydrological
    weight: 0.4
    description: "上游来水→下游河道水位上升"
    source_node: 内涝深度
    target_node: 土壤-水文状态