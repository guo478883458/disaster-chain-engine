# ============================================================================
# 区域定义模板
# ============================================================================
# 本文件定义子区域列表及其层级关系。
# 各地区复制到 configs/<地区名>/regions.yaml 后修改。
#
# 字段说明：
#   - name: 区域名称（唯一标识）
#   - parent: 上级区域（可选，用于层级组织）
#   - upstream: 上游区域列表（可选，用于水文通道）
#   - attributes: 可扩展属性（可选，如经纬度、面积等）
# ============================================================================

# 区域列表
regions:
  # 示例：北京市行政区
  - name: 示例区A
    parent: 示例市
  - name: 示例区B
    parent: 示例市