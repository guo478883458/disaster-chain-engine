# ============================================================================
# 灾害链贝叶斯网络 - 20 节点完整配置
# 5 类 20 节点：气象(6) + 水文(2) + 地形(3) + 地质(4) + 城市(3) + 中间(3) + 输出(2)
# ============================================================================
model:
  name: "暴雨→内涝→地质灾害 灾害链推理模型 (20节点完整版)"
  description: "5类20节点，扩展气象/水文/地形/地质/城市因素"
  version: "2.0-full"

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 气象输入 (6)
  # ═══════════════════════════════════════════════════════════════
  - name: 降水强度
    category: 气象
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 降水时长
    category: 气象
    states: [短, 长]
    cpd:
      type: uniform

  - name: 风力
    category: 气象
    states: [弱, 强]
    cpd:
      type: uniform

  - name: 风向
    category: 气象
    states: [离岸, 向岸]
    cpd:
      type: uniform

  - name: 湿度
    category: 气象
    states: [干燥, 湿润]
    cpd:
      type: uniform

  - name: 气压
    category: 气象
    states: [正常, 偏低]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════
  # 水文输入 (2)
  # ═══════════════════════════════════════════════════════════════
  - name: 前期土壤含水量
    category: 水文
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 径流系数
    category: 水文
    states: [小, 大]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════
  # 地形输入 (3)
  # ═══════════════════════════════════════════════════════════════
  - name: 海拔
    category: 地形
    states: [低, 高]
    cpd:
      type: uniform

  - name: 坡度
    category: 地形
    states: [缓, 陡]
    cpd:
      type: uniform

  - name: 坡向
    category: 地形
    states: [阴坡, 阳坡]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════
  # 地质输入 (4)
  # ═══════════════════════════════════════════════════════════════
  - name: 植被覆盖
    category: 地质
    states: [好, 差]
    cpd:
      type: uniform

  - name: 土壤渗透性
    category: 地质
    states: [好, 差]
    cpd:
      type: uniform

  - name: 岩性
    category: 地质
    states: [坚硬, 软弱]
    cpd:
      type: uniform

  - name: 距断层距离
    category: 地质
    states: [远, 近]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════
  # 城市输入 (3)
  # ═══════════════════════════════════════════════════════════════
  - name: 历史排水时间
    category: 城市
    states: [快, 慢]
    cpd:
      type: uniform

  - name: 管网排水能力
    category: 城市
    states: [强, 弱]
    cpd:
      type: uniform

  - name: 下垫面硬化率
    category: 城市
    states: [低, 中, 高]
    cpd:
      type: uniform

  # ═══════════════════════════════════════════════════════════════
  # 中间环节 (3)
  # ═══════════════════════════════════════════════════════════════
  - name: 暴雨强度
    category: 中间环节
    states: [弱, 强]
    cpd:
      type: weighted_sum
      parents: [降水强度, 降水时长, 风力, 风向, 湿度, 气压]
      target_state: 强
      max_prob: 0.98
      weights:
        降水强度: {低: 0.0, 中: 0.35, 高: 0.70}
        降水时长: {短: 0.0, 长: 0.20}
        风力:   {弱: 0.0, 强: 0.15}
        风向:   {离岸: 0.0, 向岸: 0.10}
        湿度:   {干燥: 0.0, 湿润: 0.08}
        气压:   {正常: 0.0, 偏低: 0.12}

  - name: 内涝深度
    category: 中间环节
    states: [无, 浅, 深]
    cpd:
      type: multi_weighted
      parents: [暴雨强度, 海拔, 前期土壤含水量, 径流系数, 历史排水时间, 管网排水能力, 下垫面硬化率]
      states:
        - name: 深
          weights:
            暴雨强度:       {弱: 0.05, 强: 0.60}
            海拔:           {低: 0.0, 高: 0.20}
            前期土壤含水量: {低: 0.0, 中: 0.10, 高: 0.20}
            径流系数:       {小: 0.0, 大: 0.15}
            历史排水时间:   {快: 0.0, 慢: 0.25}
            管网排水能力:   {强: 0.0, 弱: 0.15}
            下垫面硬化率:   {低: 0.0, 中: 0.08, 高: 0.15}
          max_prob: 0.95
        - name: 浅
          type: scaled_residual
          base: 0.55
          scale: 0.70
          residual_of: 深
        - name: 无
          type: residual

  - name: 地质易发性
    category: 中间环节
    states: [低, 高]
    cpd:
      type: weighted_sum
      parents: [坡度, 坡向, 植被覆盖, 土壤渗透性, 岩性, 距断层距离, 海拔]
      target_state: 高
      max_prob: 0.95
      weights:
        坡度:       {缓: 0.10, 陡: 0.45}
        坡向:       {阴坡: 0.0, 阳坡: 0.10}
        植被覆盖:   {好: 0.0, 差: 0.15}
        土壤渗透性: {好: 0.0, 差: 0.12}
        岩性:       {坚硬: 0.0, 软弱: 0.25}
        距断层距离: {远: 0.0, 近: 0.20}
        海拔:       {低: 0.0, 高: 0.15}

  # ═══════════════════════════════════════════════════════════════
  # 输出风险 (2)
  # ═══════════════════════════════════════════════════════════════
  - name: 内涝风险
    category: 输出
    states: [低, 中, 高]
    cpd:
      type: explicit
      parents: [内涝深度]
      values:
        # P(低|无), P(低|浅), P(低|深)
        - [0.90, 0.15, 0.02]
        # P(中|无), P(中|浅), P(中|深)
        - [0.08, 0.55, 0.13]
        # P(高|无), P(高|浅), P(高|深)
        - [0.02, 0.30, 0.85]

  - name: 地质灾害概率
    category: 输出
    states: [低, 高]
    cpd:
      type: explicit
      parents: [地质易发性, 内涝深度]
      values:
        # P(低|地质易发性,内涝深度)
        # 顺序: 地质易发性(低,高) × 内涝深度(无,浅,深)
        - [0.98, 0.85, 0.60, 0.70, 0.30, 0.10]
        # P(高|地质易发性,内涝深度)
        - [0.02, 0.15, 0.40, 0.30, 0.70, 0.90]

edges:
  # 气象 → 暴雨强度
  - [降水强度, 暴雨强度]
  - [降水时长, 暴雨强度]
  - [风力, 暴雨强度]
  - [风向, 暴雨强度]
  - [湿度, 暴雨强度]
  - [气压, 暴雨强度]

  # 暴雨强度 + 水文/地形/城市 → 内涝深度
  - [暴雨强度, 内涝深度]
  - [海拔, 内涝深度]
  - [前期土壤含水量, 内涝深度]
  - [径流系数, 内涝深度]
  - [历史排水时间, 内涝深度]
  - [管网排水能力, 内涝深度]
  - [下垫面硬化率, 内涝深度]

  # 地形/地质 → 地质易发性
  - [坡度, 地质易发性]
  - [坡向, 地质易发性]
  - [植被覆盖, 地质易发性]
  - [土壤渗透性, 地质易发性]
  - [岩性, 地质易发性]
  - [距断层距离, 地质易发性]
  - [海拔, 地质易发性]

  # 中间环节 → 输出
  - [内涝深度, 内涝风险]
  - [地质易发性, 地质灾害概率]
  - [内涝深度, 地质灾害概率]

input_params:
  - 降水强度
  - 降水时长
  - 风力
  - 风向
  - 湿度
  - 气压
  - 前期土壤含水量
  - 径流系数
  - 海拔
  - 坡度
  - 坡向
  - 植被覆盖
  - 土壤渗透性
  - 岩性
  - 距断层距离
  - 历史排水时间
  - 管网排水能力
  - 下垫面硬化率

outputs:
  - 内涝风险
  - 地质灾害概率