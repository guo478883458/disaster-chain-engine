# ============================================================================
# 灾害链贝叶斯网络 - 8 节点基线配置
# 与实验1（bn_model.py）严格一致，用于验证引擎正确性
# ============================================================================
model:
  name: "暴雨→内涝→地质灾害 灾害链推理模型 (8节点基线)"
  description: "8输入参数，与实验1代码完全一致的CPT"
  version: "2.0-baseline"

nodes:
  # ── 气象输入 ──
  - name: 降水强度
    category: 气象
    states: [低, 中, 高]
    cpd:
      type: uniform

  - name: 风力
    category: 气象
    states: [弱, 强]
    cpd:
      type: uniform

  - name: 风向
    category: 气象
    states: [离岸, 向岸]
    cpd:
      type: uniform

  # ── 地形地质输入 ──
  - name: 海拔
    category: 地形
    states: [低, 高]
    cpd:
      type: uniform

  - name: 坡度
    category: 地形
    states: [缓, 陡]
    cpd:
      type: uniform

  - name: 植被覆盖
    category: 地质
    states: [好, 差]
    cpd:
      type: uniform

  - name: 土壤渗透性
    category: 地质
    states: [好, 差]
    cpd:
      type: uniform

  # ── 城市排水输入 ──
  - name: 历史排水时间
    category: 城市
    states: [快, 慢]
    cpd:
      type: uniform

  # ── 中间环节 ──
  - name: 暴雨强度
    category: 中间环节
    states: [弱, 强]
    cpd:
      type: weighted_sum
      parents: [降水强度, 风力, 风向]
      target_state: 强          # P(强) = min(sum(weights), max_prob)
      max_prob: 0.98
      weights:
        降水强度: {低: 0.0, 中: 0.5, 高: 1.0}
        风力: {弱: 0.0, 强: 0.2}
        风向: {离岸: 0.0, 向岸: 0.15}

  - name: 内涝深度
    category: 中间环节
    states: [无, 浅, 深]
    cpd:
      type: multi_weighted
      parents: [暴雨强度, 海拔, 历史排水时间]
      states:
        - name: 深
          weights:
            暴雨强度: {弱: 0.1, 强: 0.9}
            海拔: {低: 0.0, 高: 0.25}
            历史排水时间: {快: 0.0, 慢: 0.35}
          max_prob: 0.95
        - name: 浅
          type: scaled_residual
          base: 0.55
          scale: 0.7
          residual_of: 深
        - name: 无
          type: residual

  - name: 地质易发性
    category: 中间环节
    states: [低, 高]
    cpd:
      type: weighted_sum
      parents: [坡度, 植被覆盖, 土壤渗透性, 海拔]
      target_state: 高
      max_prob: 0.95
      weights:
        坡度: {缓: 0.15, 陡: 0.65}
        植被覆盖: {好: 0.0, 差: 0.20}
        土壤渗透性: {好: 0.0, 差: 0.15}
        海拔: {低: 0.0, 高: 0.25}

  # ── 输出风险 ──
  - name: 内涝风险
    category: 输出
    states: [低, 中, 高]
    cpd:
      type: explicit
      parents: [内涝深度]
      values:
        # P(低|内涝深度), P(中|内涝深度), P(高|内涝深度)
        # 内涝深度=无, 浅, 深
        - [0.90, 0.15, 0.02]   # P(低|...)
        - [0.08, 0.55, 0.13]   # P(中|...)
        - [0.02, 0.30, 0.85]   # P(高|...)

  - name: 地质灾害概率
    category: 输出
    states: [低, 高]
    cpd:
      type: explicit
      parents: [地质易发性, 内涝深度]
      values:
        # 地质易发性=低,高  ×  内涝深度=无,浅,深
        # P(低|地质易发性,内涝深度)
        - [0.98, 0.85, 0.60, 0.70, 0.30, 0.10]
        # P(高|地质易发性,内涝深度)
        - [0.02, 0.15, 0.40, 0.30, 0.70, 0.90]

edges:
  - [降水强度, 暴雨强度]
  - [风力, 暴雨强度]
  - [风向, 暴雨强度]
  - [暴雨强度, 内涝深度]
  - [海拔, 内涝深度]
  - [历史排水时间, 内涝深度]
  - [坡度, 地质易发性]
  - [植被覆盖, 地质易发性]
  - [土壤渗透性, 地质易发性]
  - [海拔, 地质易发性]
  - [内涝深度, 内涝风险]
  - [地质易发性, 地质灾害概率]
  - [内涝深度, 地质灾害概率]

input_params:
  - 降水强度
  - 风力
  - 风向
  - 海拔
  - 坡度
  - 植被覆盖
  - 土壤渗透性
  - 历史排水时间

outputs:
  - 内涝风险
  - 地质灾害概率