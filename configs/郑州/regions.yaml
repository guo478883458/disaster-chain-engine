# 郑州下辖 6 区 5 市 1 县，共 12 个区县。
# 地理方位：西部山区（巩义/登封/新密），中部平原（荥阳/上街/中原/二七/管城/金水/惠济），东部平原（中牟/新郑）
# 水系：黄河（北部）、伊洛河（巩义）、贾鲁河（郑州中部）、双洎河（新郑）
